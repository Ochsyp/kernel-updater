# Runs the bats suite on every pull request, every push to main and once a week, and fails when
# a test is skipped. ShellCheck is pinned and checksum-verified, and grub-common provides
# grub-script-check for the example configs, so every test runs. The kali job runs the container
# suite in tests/container on a Kali rolling image built from ci/kali/Dockerfile; the weekly run
# catches changes in Kali rolling. The ntfs job runs tests/ntfs as root on the runner, where it
# builds a synthetic stick in a loop file and mounts real NTFS with ntfs3 and ntfs-3g; the fat
# job runs tests/fat the same way on a FAT32 partition 1 with syslinux's boot sector. Actions
# are pinned to commit SHAs; Dependabot proposes updates.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # An explicit bash adds -o pipefail, so the tee below cannot hide a failing bats run.
        shell: bash
    env:
      BATS_VERSION: 1.13.0
      SHELLCHECK_VERSION: 0.11.0
      # SHA-256 of shellcheck-v0.11.0.linux.x86_64.tar.xz, as GitHub lists it for the release asset.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats, ShellCheck and grub-script-check
        run: |
          # A global npm install cannot write to /usr/local on the runner, so bats goes into a
          # temporary prefix that later steps find through GITHUB_PATH.
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/bats" "bats@${BATS_VERSION}"
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$archive"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          # grub-common ships grub-script-check; mawk (Debian's default awk) and gawk both run
          # the lint tests.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends grub-common mawk gawk
          "$RUNNER_TEMP/bats/node_modules/.bin/bats" --version
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"
          command -v grub-script-check
      - name: Run the tests
        run: bats --tap tests/ | tee "$RUNNER_TEMP/bats.tap"
      - name: Fail on skipped tests
        run: |
          if grep -E '^ok [0-9]+ .* # skip' "$RUNNER_TEMP/bats.tap"; then
            echo "::error::Tests were skipped; every test must run in CI."
            exit 1
          fi

  kali:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # An explicit bash adds -o pipefail, so the tee below cannot hide a failing bats run.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Kali image
        run: docker build --tag kernel-updater-kali ci/kali
      - name: Run the container tests
        # --privileged lets the tests mount a tmpfs or a loop-mounted ext4 image on /boot and
        # check bind-mount / read-only. The checkout is mounted read-only; the tests change
        # only the container, where they install kernel-updater and its hooks.
        run: |
          docker run --rm --privileged --volume "$PWD:/src:ro" kernel-updater-kali \
            bats --tap tests/container | tee "$RUNNER_TEMP/kali.tap"
      - name: Fail on skipped tests
        run: |
          if grep -E '^ok [0-9]+ .* # skip' "$RUNNER_TEMP/kali.tap"; then
            echo "::error::Container tests were skipped; every one must run in the Kali job."
            exit 1
          fi

  ntfs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # An explicit bash adds -o pipefail, so the tee below cannot hide a failing bats run.
        shell: bash
    env:
      BATS_VERSION: 1.13.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats and ntfs-3g, and load ntfs3
        run: |
          # As in the bats job, bats goes into a temporary prefix that later steps find
          # through GITHUB_PATH.
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/bats" "bats@${BATS_VERSION}"
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"
          # ntfs-3g provides mkntfs, ntfslabel and mount.ntfs-3g, fdisk provides sfdisk, and
          # dmsetup the device-mapper device the migrate test mounts as /boot.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ntfs-3g fdisk dmsetup
          # A kernel flavour that keeps ntfs3 among its extra modules gets those first.
          if ! sudo modprobe ntfs3; then
            sudo apt-get install -y -qq --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe ntfs3
          fi
          "$RUNNER_TEMP/bats/node_modules/.bin/bats" --version
      - name: Run the NTFS tests
        # The tests attach a loop device, make filesystems on it and mount them, so they run as
        # root; they change only the loop file they build and what they mount under their own
        # temporary directories.
        run: sudo env "PATH=$PATH" KU_NTFS=1 bats --tap tests/ntfs | tee "$RUNNER_TEMP/ntfs.tap"
      - name: Fail on skipped tests
        run: |
          if grep -E '^ok [0-9]+ .* # skip' "$RUNNER_TEMP/ntfs.tap"; then
            echo "::error::NTFS tests were skipped; every one must run in the ntfs job."
            exit 1
          fi

  fat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # An explicit bash adds -o pipefail, so the tee below cannot hide a failing bats run.
        shell: bash
    env:
      BATS_VERSION: 1.13.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats, dosfstools and syslinux
        run: |
          # As in the bats job, bats goes into a temporary prefix that later steps find
          # through GITHUB_PATH.
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/bats" "bats@${BATS_VERSION}"
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"
          # dosfstools provides mkfs.vfat, syslinux and mtools install syslinux's boot sector
          # without a mount, fdisk provides sfdisk, and dmsetup the device-mapper device the
          # migrate test mounts as /boot. The kernel has vfat built in.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dosfstools syslinux mtools fdisk \
            dmsetup
          "$RUNNER_TEMP/bats/node_modules/.bin/bats" --version
      - name: Run the FAT tests
        # The tests attach a loop device, make filesystems on it and mount them, so they run as
        # root; they change only the loop file they build and what they mount under their own
        # temporary directories.
        run: sudo env "PATH=$PATH" KU_FAT=1 bats --tap tests/fat | tee "$RUNNER_TEMP/fat.tap"
      - name: Fail on skipped tests
        run: |
          if grep -E '^ok [0-9]+ .* # skip' "$RUNNER_TEMP/fat.tap"; then
            echo "::error::FAT tests were skipped; every one must run in the fat job."
            exit 1
          fi

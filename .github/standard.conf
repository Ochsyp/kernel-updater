# .github/standard.conf of this repository: data for .github/standard/bin/conf, which alone
# reads it (.github/standard/README.md, Rules). Each commented KEY= line shows its default.
NAME=kernel-updater
VISIBILITY=public
# ROLE=consumer
# LICENSE=MIT
# CI_RUNNER=ubuntu
# ci/test runs the bats suites in tests/. ci/system runs the Kali container suite, and the NTFS
# and FAT suites as root on loop devices.
CI_STAGES=test system
# Weekly, so that a change in the Kali packages the container image installs shows up.
CI_WEEKLY=yes
# legacy until the release adoption, which comes in its own pull request.
RELEASE_KIND=legacy
# install.sh installs share/kernel-updater/VERSION, which the tool prints; it holds VERSION's line.
VERSION_COPY=share/kernel-updater/VERSION|X.Y.Z
# Releases are installed by hand on Kali; no host installs sealed releases only.
# SEAL=no
# disk adds the rules for disk, partition and filesystem identifiers this tool handles.
PRIVACY_RULES=base disk

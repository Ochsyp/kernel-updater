# Weekly update pull requests, grouped so each ecosystem opens at most one at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
  # The digest of the Kali rolling image the container tests run on.
  - package-ecosystem: docker
    directory: /ci/kali
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

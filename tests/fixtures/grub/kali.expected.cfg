# Kali GNU/Linux on this stick, loaded by multibootusb/grub/grub.cfg with source.
# Written by kernel-updater migrate; do not edit this file by hand. To change it, as for other
# menu_variants, run 'kernel-updater migrate --stage menu' again, which writes it anew from the
# legacy entries in grub.cfg; after the finalize stage removed them, roll that stage back first.
# The entries boot /vmlinuz and /initrd.img, which linux-base points at the newest kernel, and
# /vmlinuz.old and /initrd.img.old, which it points at the previous one, so this file stays the
# same when kernels are installed or removed.
submenu "Kali GNU/Linux amd64 (full install)" --id kali {
	menuentry "Kali GNU/Linux" --id kali-default {
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000c01
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000c01' 5ca1ab1e-0000-4000-8000-000000000b01
		if [ -s /vmlinuz -a -s /initrd.img ]; then
			echo 'Loading Linux (current kernel) ...'
			linux /vmlinuz root=/dev/mapper/kali--vg-root ro quiet splash
			echo 'Loading initial ramdisk ...'
			initrd /initrd.img
		else
			echo '/vmlinuz or /initrd.img is missing on /boot: choose a previous-kernel entry.'
			sleep 10
		fi
	}
	menuentry "Kali GNU/Linux (previous kernel)" --id kali-previous {
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000c01
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000c01' 5ca1ab1e-0000-4000-8000-000000000b01
		if [ -s /vmlinuz.old -a -s /initrd.img.old ]; then
			echo 'Loading Linux (previous kernel) ...'
			linux /vmlinuz.old root=/dev/mapper/kali--vg-root ro quiet splash
			echo 'Loading initial ramdisk ...'
			initrd /initrd.img.old
		else
			echo '/vmlinuz.old or /initrd.img.old is missing on /boot: choose a current-kernel entry.'
			sleep 10
		fi
	}
	menuentry "Kali GNU/Linux (fail-safe mode)" --id kali-failsafe {
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000c01
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000c01' 5ca1ab1e-0000-4000-8000-000000000b01
		if [ -s /vmlinuz -a -s /initrd.img ]; then
			echo 'Loading Linux (current kernel) ...'
			linux /vmlinuz root=/dev/mapper/kali--vg-root ro nomodeset noapic nolapic nosplash
			echo 'Loading initial ramdisk ...'
			initrd /initrd.img
		else
			echo '/vmlinuz or /initrd.img is missing on /boot: choose a previous-kernel entry.'
			sleep 10
		fi
	}
	menuentry "Kali GNU/Linux (fail-safe, previous kernel)" --id kali-failsafe-previous {
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000c01
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000c01' 5ca1ab1e-0000-4000-8000-000000000b01
		if [ -s /vmlinuz.old -a -s /initrd.img.old ]; then
			echo 'Loading Linux (previous kernel) ...'
			linux /vmlinuz.old root=/dev/mapper/kali--vg-root ro nomodeset noapic nolapic nosplash
			echo 'Loading initial ramdisk ...'
			initrd /initrd.img.old
		else
			echo '/vmlinuz.old or /initrd.img.old is missing on /boot: choose a current-kernel entry.'
			sleep 10
		fi
	}
}

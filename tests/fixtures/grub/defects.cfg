# Synthetic GRUB config for kernel-updater's lint tests: every defect class appears at least
# once, with made-up identifiers that start with 5ca1ab1e. tests/fixtures/grub/defects.expected
# lists what lint must report, with --floor 2.02.
insmod part_msdos
insmod nfts
set timeout=10

function load_video {
	insmod all_video
}

if loadfont /multibootusb/grub/unicode.pf2 ; then
	if terminal_output gfxterm ; then true ; else
		terminal gfxterm
	fi
fi

#start kali-live.iso
submenu "Kali (marked)" {
	menuentry "Kali inside markers" {
		lload_video
		cryptomount -u 5ca1ab1e-0000-4000-8000-00000000b001
		set root='cryptouuid/5ca1ab1e-0000-4000-8000-00000000b001'
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e-0000-4000-8000-00000000b001' 5ca1ab1e-0000-4000-8000-00000000b001
		linux /vmlinuz root=/dev/mapper/kali--vg-root ro cryptdevice=UUID=5ca1ab1e:root noswap overlayroot=tmpfs:resurce=0
		initrd /initrd.img
	}
}
#end kali-live.iso

menuentry "Malformed identifiers" {
	load_video
	cryptomount -u 5ca1ab1e00004000800000000000b00
	set root='cryptouuid/5ca1ab1e0-0000-4000-8000-00000000b001'
	search --no-floppy --fs-uuid --set=root 5ca1ab1e0-0000-4000-8000-000000000b02
	linux /vmlinuz root=/dev/mapper/kali--vg-root ro
}

menuentry "Hard-coded drive"{
	set root='(hd0,msdos5)'
	loopback loop (hd0,msdos5)/live.iso
	linux (loop)/live/vmlinuz boot=live overlayroot=tmpfs:recurse=0,swap=1
}

#start second.iso
menuentry "Encrypted inside a second marked block" {
	cryptomount -u 5ca1ab1e000040008000000000000b03
}
#end second.iso

menuentry "Encrypted after the markers" {
	cryptomount -u 5ca1ab1e000040008000000000000b04
}

menuentry "Search after another entry's LUKS UUID" {
	search --no-floppy --fs-uuid --set=root 5ca1ab1e-0000-4000-8000-000000000b04
}

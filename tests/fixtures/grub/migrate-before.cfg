# This file is created by MultiBootUSB.
# Synthetic fixture for kernel-updater migrate: a MultiBootUSB menu with the hand-made Kali
# submenu whose entries name a kernel version, as the stick holds it before the migration. The
# tests give it CRLF line endings, as MultiBootUSB writes them. Every identifier is made up and
# starts with 5ca1ab1e. A comment that holds a brace, }, counts for nothing.
insmod part_msdos
insmod fat
insmod ntfs
insmod ext2
insmod all_video
insmod configfile
insmod normal
insmod linux
insmod echo
insmod search
insmod regexp
insmod cryptodisk
insmod luks
insmod gcry_rijndael
insmod gcry_sha256
insmod lvm

set timeout=30

probe -u $root --set=rootuuid
set imgdevpath="/dev/disk/by-uuid/$rootuuid"
export imgdevpath rootuuid

function load_video {
	if [ x$feature_all_video_module = xy ]; then
		insmod all_video
	else
		insmod efi_gop
		insmod efi_uga
		insmod ieee1275_fb
		insmod vbe
		insmod vga
		insmod video_bochs
		insmod video_cirrus
	fi
}

menuentry "Reboot USB {now}" {
	reboot
}

if [ ${grub_platform} == "pc" ]; then
	menuentry 'Load Syslinux Boot Loader }' {
		insmod part_msdos
		insmod ntfs
		insmod chain
		search --no-floppy --fs-uuid --set=root 5CA1AB1E00000001
		chainloader /multibootusb/syslinux.bin
	}
fi

submenu "Kali GNU/Linux amd64 (full install)" {
	menuentry "Kali GNU/Linux (persistence)" --hotkey=l {
		load_video
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000c01
		set root='cryptouuid/5ca1ab1e000040008000000000000c01'
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000c01' 5ca1ab1e-0000-4000-8000-000000000b01
		echo 'Loading Linux 7.2.9+kali-amd64 ... {'
		linux /vmlinuz-7.2.9+kali-amd64 root=/dev/mapper/kali--vg-root cryptdevice=UUID=5ca1ab1e-0000-4000-8000-000000000c02:root_crypt ro quiet splash
		echo 'Loading initial ramdisk ...'
		initrd /initrd.img-7.2.9+kali-amd64
	}

	menuentry "Kali GNU/Linux (fail-safe mode)" {
		load_video
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000c01
		set root='cryptouuid/5ca1ab1e000040008000000000000c01'
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000c01' 5ca1ab1e-0000-4000-8000-000000000b01
		echo "Loading Linux 7.2.9+kali-amd64 ... \"}\""
		linux /vmlinuz-7.2.9+kali-amd64 root=/dev/mapper/kali--vg-root ro nomodeset noapic nolapic nosplash
		echo 'Loading initial ramdisk ...'
		initrd /initrd.img-7.2.9+kali-amd64
	}

	menuentry "Kali GNU/Linux (live mode)" {
		load_video
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000c01
		set root='cryptouuid/5ca1ab1e000040008000000000000c01'
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000c01' 5ca1ab1e-0000-4000-8000-000000000b01
		echo 'Loading Linux 7.2.9+kali-amd64 ...'
		linux /vmlinuz-7.2.9+kali-amd64 root=/dev/mapper/kali--vg-root ro quiet splash overlayroot=tmpfs:resurce=0
		echo 'Loading initial ramdisk ...'
		initrd /initrd.img-7.2.9+kali-amd64
	}

	menuentry "Kali GNU/Linux (forensic mode)" {
		load_video
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000c01
		set root='cryptouuid/5ca1ab1e000040008000000000000c01'
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000c01' 5ca1ab1e-0000-4000-8000-000000000b01
		echo 'Loading Linux 7.2.9+kali-amd64 ...'
		linux /vmlinuz-7.2.9+kali-amd64 root=/dev/mapper/kali--vg-root ro quiet splash overlayroot=tmpfs noswap noautomount
		echo 'Loading initial ramdisk ...'
		initrd /initrd.img-7.2.9+kali-amd64
	}
}

#start gparted-live-amd64.iso
menuentry "GParted live (amd64)" {
	insmod part_msdos
	insmod ext2
	search --no-floppy --fs-uuid --set=root 5ca1ab1e-0000-4000-8000-000000000006
	set isofile=/gparted-live-amd64.iso
	loopback loop $isofile
	linux (loop)/live/vmlinuz boot=live union=overlay username=user config components toram=filesystem.squashfs findiso=$isofile
	initrd (loop)/live/initrd.img
}
#end gparted-live-amd64.iso

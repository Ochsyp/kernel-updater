# This file is created by MultiBootUSB.
# Synthetic example for kernel-updater: a MultiBootUSB menu with a hand-made Kali submenu
# whose entries name a kernel version. Every identifier is made up and starts with 5ca1ab1e.
#
# blkid output of the stick, as such configs often carry it:
#/dev/sdb1: LABEL="BOOT" UUID="5CA1AB1E00000001" TYPE="ntfs" PARTUUID="5ca1ab1e-01"
#/dev/sdb2: UUID="5ca1ab1e-0000-4000-8000-000000000b00" TYPE="crypto_LUKS" PARTUUID="5ca1ab1e-02"
#/dev/sdb3: LABEL="DATA" UUID="5CA1-AB1E" TYPE="vfat" PARTUUID="5ca1ab1e-03"
#/dev/mapper/sdb4_crypt: UUID="5ca1ab-1e00-0000-0000-0000-0000-000001" TYPE="LVM2_member"
insmod part_msdos
insmod fat
insmod ntfs
insmod ext2
insmod all_video
insmod configfile
insmod normal
insmod linux
insmod echo
insmod search
insmod regexp
insmod cryptodisk
insmod luks
insmod gcry_rijndael
insmod gcry_sha256
insmod lvm

set timeout=30

probe -u $root --set=rootuuid
set imgdevpath="/dev/disk/by-uuid/$rootuuid"
export imgdevpath rootuuid

insmod font
if loadfont /multibootusb/grub/unicode.pf2 ; then
	# Hold Shift to skip the graphical terminal.
	if keystatus --shift ; then true ; else
		if [ "${grub_platform}" == "efi" ]; then
			insmod efi_gop
			insmod efi_uga
		else
			insmod vbe
			insmod vga
			set gfxmode=auto
			set gfxpayload=auto
			terminal_output gfxterm
		fi
		insmod gfxterm
	fi
fi

function load_video {
	if [ x$feature_all_video_module = xy ]; then
		insmod all_video
	else
		insmod efi_gop
		insmod efi_uga
		insmod ieee1275_fb
		insmod vbe
		insmod vga
		insmod video_bochs
		insmod video_cirrus
	fi
}

set color_normal=white/black
set color_highlight=white/light-blue
export color_normal
export color_highlight

menuentry "Reboot USB" {
	reboot
}

if [ ${grub_platform} == "pc" ]; then
	menuentry "Load Syslinux Boot Loader" {
		insmod part_msdos
		insmod ntfs
		insmod chain
		search --no-floppy --fs-uuid --set=root 5CA1AB1E00000001
		chainloader /multibootusb/syslinux.bin
	}
fi

submenu "Kali GNU/Linux amd64 (full install)" {
	menuentry "Kali GNU/Linux (persistence)" --hotkey=l {
		load_video
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000b00
		set root='cryptouuid/5ca1ab1e000040008000000000000b00'
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000b00' 5ca1ab1e-0000-4000-8000-000000000b01
		echo 'Loading Linux 7.2.9+kali-amd64 ...'
		linux /vmlinuz-7.2.9+kali-amd64 root=/dev/mapper/kali--vg-root ro quiet splash
		echo 'Loading initial ramdisk ...'
		initrd /initrd.img-7.2.9+kali-amd64
	}

	menuentry "Kali GNU/Linux (fail-safe mode)" {
		load_video
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000b00
		set root='cryptouuid/5ca1ab1e000040008000000000000b00'
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000b00' 5ca1ab1e-0000-4000-8000-000000000b01
		echo 'Loading Linux 7.2.9+kali-amd64 ...'
		linux /vmlinuz-7.2.9+kali-amd64 root=/dev/mapper/kali--vg-root ro nomodeset noapic nolapic nosplash
		echo 'Loading initial ramdisk ...'
		initrd /initrd.img-7.2.9+kali-amd64
	}

	menuentry "Kali GNU/Linux (live mode)" {
		load_video
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000b00
		set root='cryptouuid/5ca1ab1e000040008000000000000b00'
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000b00' 5ca1ab1e-0000-4000-8000-000000000b01
		echo 'Loading Linux 7.2.9+kali-amd64 ...'
		linux /vmlinuz-7.2.9+kali-amd64 root=/dev/mapper/kali--vg-root ro quiet splash overlayroot=tmpfs:recurse=0
		echo 'Loading initial ramdisk ...'
		initrd /initrd.img-7.2.9+kali-amd64
	}

	menuentry "Kali GNU/Linux (forensic mode)" {
		load_video
		insmod gzio
		insmod part_msdos
		insmod cryptodisk
		insmod luks
		insmod gcry_rijndael
		insmod gcry_sha256
		insmod ext2
		cryptomount -u 5ca1ab1e000040008000000000000b00
		set root='cryptouuid/5ca1ab1e000040008000000000000b00'
		search --no-floppy --fs-uuid --set=root --hint='cryptouuid/5ca1ab1e000040008000000000000b00' 5ca1ab1e-0000-4000-8000-000000000b01
		echo 'Loading Linux 7.2.9+kali-amd64 ...'
		linux /vmlinuz-7.2.9+kali-amd64 root=/dev/mapper/kali--vg-root ro quiet splash overlayroot=tmpfs systemd.swap=0 noautomount
		echo 'Loading initial ramdisk ...'
		initrd /initrd.img-7.2.9+kali-amd64
	}
}

menuentry "GParted live (amd64)" {
	insmod part_msdos
	insmod ext2
	search --no-floppy --fs-uuid --set=root 5ca1ab1e-0000-4000-8000-000000000006
	set isofile=/gparted-live-amd64.iso
	loopback loop $isofile
	linux (loop)/live/vmlinuz boot=live union=overlay username=user config components toram=filesystem.squashfs findiso=$isofile
	initrd (loop)/live/initrd.img
}

# Example /etc/kernel-updater.conf. Copy it there as root, owned by root with mode 0644 or
# stricter. The file is parsed, never sourced: "key = value" lines, and lines that start
# with # are comments.

# Oldest GRUB the stick's configs must run on: 2.02, 2.06, 2.12 or 2.14. Below 2.12, lint
# reports LUKS UUIDs written with dashes, which older GRUB never matches.
grub_floor = 2.02

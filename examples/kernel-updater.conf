# Example /etc/kernel-updater.conf. Copy it there as root, owned by root with mode 0644 or
# stricter. The file is parsed, never sourced: "key = value" lines, and lines that start
# with # are comments.

# Oldest GRUB the stick must run on: 2.02, 2.06, 2.12 or 2.14. check fails when that GRUB
# cannot unlock the LUKS container of /boot or read its ext filesystem. Below 2.12, lint reports
# LUKS UUIDs written with dashes, which older GRUB never matches.
grub_floor = 2.02

# UUID of the ext filesystem mounted at /boot, as "findmnt -n -o UUID /boot" prints it. Setting
# it arms the hooks install.sh installs, which then refuse kernel installs, removals and apt
# runs while /boot is not this filesystem; until it is set they only warn. check fails when
# another filesystem is mounted at /boot. The value below is made up.
# boot_fs_uuid = 5ca1ab1e-0000-4000-8000-000000000b01

# UUID of the LUKS container that holds /boot, as "cryptsetup luksUUID DEVICE" prints it.
# check fails when /boot is not in that container. The value below is made up.
# boot_luks_uuid = 5ca1ab1e-0000-4000-8000-000000000c01

# What the postinst hook does with a new kernel whose files, initrd or /boot links would not
# boot it: fail, the default, stops its configure and leaves the package half-configured;
# warn only warns.
# verify_action = fail

# The stick's disk, as the PTUUID that "lsblk -o NAME,LABEL,PTUUID,UUID" prints for it: the 8
# hex digits of the disk signature for an MBR disk, or a UUID for a GPT disk. Together with
# p1_fs_uuid it tells the stick apart: check fails, and baseline and the writers refuse, on
# another disk. The value below is made up.
# disk_ptuuid = 5ca1ab1e

# The UUID that "lsblk -o NAME,LABEL,PTUUID,UUID" prints for the stick's partition labelled
# BOOT, the NTFS serial of its partition 1: 16 hex digits. The value below is made up.
# p1_fs_uuid = 5CA1AB1E00000001

# How the files phase 6 writes reach partition 1: auto, the default, writes them through a
# mount of partition 1 natively, and exports them in a VM, where Windows may have partition 1
# mounted on the host and the guest never writes it; direct does the same, exporting in a VM
# too; export leaves them in output_dir with steps for Windows; path writes them through
# p1_path, in a VM too, where the host then writes. auto and direct fall back to export,
# saying why, when their own read-write mount finds partition 1 hibernated, unclean or marked
# dirty, or the kernel has no ntfs3, which writing needs; path, and a read-write mount of
# partition 1 that root made, are written as they are. While a desktop has partition 1
# mounted for its user, nothing is written or exported until you unmount it there.
# deploy = auto

# Where partition 1's root is mounted already, such as a VirtualBox shared folder of the
# stick's BOOT partition. It serves only while it is a mount point that holds
# multibootusb/grub/grub.cfg, the same as partition 1's when that can be read: then check and
# baseline read there, and otherwise partition 1 itself. deploy = path writes there, and a
# plan reads there what it builds on, only while no user but root can change its files, as
# with a share mounted with the vboxsf options uid=0,gid=0,dmode=0700,fmode=0600, and while
# the share is mounted nowhere else, so turn VirtualBox's automount of it off.
# p1_path = /media/sf_BOOT

# Where an export goes: a directory of root's closed to group and others, mode 0700. It holds the
# latest export only: an export removes the files of the one before that it does not hold.
# output_dir = /root/kernel-updater/out

# How many dated backups of each file on partition 1 a write keeps beside it: 1 to 99.
# backups_keep = 5

# What the Kali entries of kali.cfg pass the kernel as root=: an absolute device path, such as
# the LVM volume below, or UUID= and the root filesystem's UUID. "kernel-updater migrate --stage
# detect" sets it from the running kernel's command line. The value below is made up.
# root_device = /dev/mapper/kali--vg-root

# The entries kali.cfg gets, in this order: default, the plain one, which comes first and must
# be there, then any of failsafe, live and forensic. live and forensic boot through overlayroot,
# so they need the package overlayroot in the initrd.
# menu_variants = default,failsafe

# The variants of menu_variants that also get an entry for the previous kernel, which boots
# /vmlinuz.old and /initrd.img.old. Unless set here, a variant menu_variants lacks is left out.
# previous_variants = default,failsafe
